name: canonical-ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    container: golang:1.24.6@sha256:8d9e57c5a6f2bede16fe674c16149eee20db6907129e02c4ad91ce5a697a4012
    steps: [{uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683}, {run: make build}]
  lint:
    runs-on: ubuntu-latest
    container: golang:1.24.6@sha256:8d9e57c5a6f2bede16fe674c16149eee20db6907129e02c4ad91ce5a697a4012
    steps: [{uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683}, {run: make lint}]
  test:
    runs-on: ubuntu-latest
    container: golang:1.24.6@sha256:8d9e57c5a6f2bede16fe674c16149eee20db6907129e02c4ad91ce5a697a4012
    steps: [{uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683}, {run: make test}]
  smoke:
    runs-on: ubuntu-latest
    container: golang:1.24.6@sha256:8d9e57c5a6f2bede16fe674c16149eee20db6907129e02c4ad91ce5a697a4012
    steps: [{uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683}, {run: make smoke}]
  preview:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps: [{run: make preview}]
  release:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps: [{run: make release}, {run: make rollback}]
